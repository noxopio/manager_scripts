<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 584" width="980" height="584" role="img" aria-label="La terminal entra por mfs a manager_repo.sh; el navegador usa el frontend y server.js, que lanza manager_repo.sh por repo; debajo, remotos git, repos clonados, listRep.txt y procesos del sistema.">
<title>Arquitectura de mfs</title>
<style>
.bg{fill:#f5f7f7}
.ttl{font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#14201f}
.n{fill:#ffffff;stroke:#9fb0ae;stroke-width:1.2}
.n.hl{fill:#e2f2ef;stroke:#0d7a6f;stroke-width:1.6}
.n.bad{fill:#fbecea;stroke:#b5503f;stroke-width:1.4}
.n.dash{stroke-dasharray:5 4}
.t{font:700 13px ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:#14201f;text-anchor:middle}
.s{font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#556563;text-anchor:middle}
.d{font:600 12.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#14201f;text-anchor:middle}
.l{font:500 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#556563;paint-order:stroke;stroke:#f5f7f7;stroke-width:4px;stroke-linejoin:round}
.st{text-anchor:start}
.e{fill:none;stroke:#14201f;stroke-width:1.3}
.e.dash{stroke-dasharray:5 4}
.e.acc{stroke:#0d7a6f}
.e.life{stroke:#9fb0ae;stroke-dasharray:3 4}
.ah{fill:#14201f}
.dot{fill:#14201f}
@media (prefers-color-scheme:dark){
.bg{fill:#0f1716}
.ttl,.t,.d{fill:#e3ecea}
.s,.l{fill:#94a6a3}
.l{stroke:#0f1716}
.n{fill:#172221;stroke:#4b5f5c}
.n.hl{fill:#163631;stroke:#4fc2b2}
.n.bad{fill:#3a1f1b;stroke:#e0806f}
.e{stroke:#e3ecea}
.e.acc{stroke:#4fc2b2}
.e.life{stroke:#4b5f5c}
.ah,.dot{fill:#e3ecea}
}
</style>
<defs><marker id="ar-arquitectura" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="980" height="584" rx="10"/>
<text class="ttl" x="40" y="30">Arquitectura de mfs</text>
<g transform="translate(0,44)">
<rect class="n " x="40" y="20" width="220" height="52" rx="6"/><text class="t" x="150" y="42">Terminal</text><text class="s" x="150" y="59">Git Bash, Linux o WSL</text>
<rect class="n " x="620" y="20" width="320" height="52" rx="6"/><text class="t" x="780" y="42">Navegador</text><text class="s" x="780" y="59">http://127.0.0.1:&lt;puerto&gt;</text>
<rect class="n " x="40" y="110" width="220" height="52" rx="6"/><text class="t" x="150" y="132">mfs()</text><text class="s" x="150" y="149">manager_rc.sh · cdlist y alias</text>
<rect class="n dash" x="320" y="110" width="200" height="52" rx="6"/><text class="t" x="420" y="132">manager_install.sh</text><text class="s" x="420" y="149">copia scripts y edita .bashrc</text>
<rect class="n " x="620" y="110" width="320" height="64" rx="6"/><text class="t" x="780" y="130">ui/index.html + js/*.js</text><text class="s" x="780" y="147">repos · stream · lists · git · curl · palette</text><text class="s" x="780" y="162">css/ por capas: tokens, base, layout…</text>
<rect class="n hl" x="40" y="230" width="400" height="120" rx="6"/>
<text class="t" x="240" y="256">manager_repo.sh</text>
<text class="s" x="240" y="278">despacha: pull · run · install · updeps</text>
<text class="s" x="240" y="296">status · commit · push · checkout · newbranch · unlock</text>
<text class="s" x="240" y="324">usa manager_logs.sh · git-askpass.sh · url_extractor.sh</text>
<rect class="n hl" x="620" y="230" width="320" height="120" rx="6"/>
<text class="t" x="780" y="256">ui/server.js (Node ≥ 18)</text>
<text class="s" x="780" y="278">API REST /api/* · SSE /api/stream</text>
<text class="s" x="780" y="296">jobs: un bash por repo, log guardado en disco</text>
<text class="s" x="780" y="324">token git solo en memoria</text>
<rect class="n " x="40" y="460" width="170" height="64" rx="6"/><text class="t" x="125" y="488">Remotos git</text><text class="s" x="125" y="505">GitHub · Azure DevOps</text>
<rect class="n " x="250" y="460" width="220" height="64" rx="6"/><text class="t" x="360" y="488">Repos en WORK_DIR</text><text class="s" x="360" y="505">clones · node_modules · mf vivos</text>
<rect class="n " x="510" y="460" width="180" height="64" rx="6"/><text class="t" x="600" y="480">listRep.txt</text><text class="s" x="600" y="497">URL y comando por línea</text><text class="s" x="600" y="512">marcas #NEW · #EXCLUDE</text>
<rect class="n " x="730" y="460" width="210" height="64" rx="6"/><text class="t" x="835" y="488">Procesos del SO</text><text class="s" x="835" y="505">explorer · code · curl · taskkill</text>
<line class="e " x1="150" y1="72" x2="150" y2="108" marker-end="url(#ar-arquitectura)"/>
<text class="l" x="158" y="95" text-anchor="start">mfs &lt;cmd&gt;</text>
<line class="e dash" x1="320" y1="136" x2="262" y2="136" marker-end="url(#ar-arquitectura)"/>
<text class="l" x="291" y="128" text-anchor="middle">instala</text>
<line class="e " x1="150" y1="162" x2="150" y2="228" marker-end="url(#ar-arquitectura)"/>
<text class="l" x="158" y="200" text-anchor="start">ejecuta</text>
<line class="e " x1="780" y1="72" x2="780" y2="108" marker-end="url(#ar-arquitectura)"/>
<text class="l" x="788" y="95" text-anchor="start">carga</text>
<line class="e " x1="720" y1="174" x2="720" y2="228" marker-end="url(#ar-arquitectura)"/>
<text class="l" x="712" y="205" text-anchor="end">fetch /api/*</text>
<line class="e acc" x1="840" y1="230" x2="840" y2="176" marker-end="url(#ar-arquitectura)"/>
<text class="l" x="848" y="205" text-anchor="start">SSE: logs y estado</text>
<line class="e " x1="440" y1="270" x2="618" y2="270" marker-end="url(#ar-arquitectura)"/>
<text class="l" x="530" y="262" text-anchor="middle">ui: node server.js</text>
<line class="e " x1="620" y1="320" x2="442" y2="320" marker-end="url(#ar-arquitectura)"/>
<text class="l" x="530" y="312" text-anchor="middle">spawn bash · MFS_ONLY</text>
<line class="e " x1="360" y1="350" x2="360" y2="458" marker-end="url(#ar-arquitectura)"/>
<text class="l" x="352" y="405" text-anchor="end">git · npm · run</text>
<polyline class="e " points="420,350 420,410 560,410 560,458" marker-end="url(#ar-arquitectura)"/>
<text class="l" x="490" y="402" text-anchor="middle">lee la lista</text>
<line class="e " x1="650" y1="350" x2="650" y2="458" marker-end="url(#ar-arquitectura)"/>
<text class="l" x="658" y="405" text-anchor="start">PUT /api/list</text>
<line class="e " x1="860" y1="350" x2="860" y2="458" marker-end="url(#ar-arquitectura)"/>
<text class="l" x="868" y="405" text-anchor="start">lanza</text>
<line class="e" x1="250" y1="492" x2="212" y2="492" marker-start="url(#ar-arquitectura)" marker-end="url(#ar-arquitectura)"/>
<text class="l" x="231" y="484" text-anchor="middle">git</text>
</g>
</svg>
