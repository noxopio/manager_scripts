<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 644" width="980" height="644" role="img" aria-label="Las peticiones pasan por escuchar solo en 127.0.0.1, la comprobación de Host y cabecera X-MFS, la validación de /api/action y las rutas confinadas a WORK_DIR antes de llegar a bash; el token git solo vive en memoria y llega a git por GIT_ASKPASS.">
<title>Límites de seguridad del panel</title>
<style>
.bg{fill:#f5f7f7}
.ttl{font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#14201f}
.n{fill:#ffffff;stroke:#9fb0ae;stroke-width:1.2}
.n.hl{fill:#e2f2ef;stroke:#0d7a6f;stroke-width:1.6}
.n.bad{fill:#fbecea;stroke:#b5503f;stroke-width:1.4}
.n.dash{stroke-dasharray:5 4}
.t{font:700 13px ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:#14201f;text-anchor:middle}
.s{font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#556563;text-anchor:middle}
.d{font:600 12.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#14201f;text-anchor:middle}
.l{font:500 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#556563;paint-order:stroke;stroke:#f5f7f7;stroke-width:4px;stroke-linejoin:round}
.st{text-anchor:start}
.e{fill:none;stroke:#14201f;stroke-width:1.3}
.e.dash{stroke-dasharray:5 4}
.e.acc{stroke:#0d7a6f}
.e.life{stroke:#9fb0ae;stroke-dasharray:3 4}
.ah{fill:#14201f}
.dot{fill:#14201f}
@media (prefers-color-scheme:dark){
.bg{fill:#0f1716}
.ttl,.t,.d{fill:#e3ecea}
.s,.l{fill:#94a6a3}
.l{stroke:#0f1716}
.n{fill:#172221;stroke:#4b5f5c}
.n.hl{fill:#163631;stroke:#4fc2b2}
.n.bad{fill:#3a1f1b;stroke:#e0806f}
.e{stroke:#e3ecea}
.e.acc{stroke:#4fc2b2}
.e.life{stroke:#4b5f5c}
.ah,.dot{fill:#e3ecea}
}
</style>
<defs><marker id="ar-seguridad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="980" height="644" rx="10"/>
<text class="ttl" x="40" y="30">Límites de seguridad del panel</text>
<g transform="translate(0,44)">
<rect class="n " x="40" y="20" width="560" height="48" rx="6"/><text class="t" x="320" y="40">Navegador u otra web abierta</text><text class="s" x="320" y="57">cualquier petición al puerto del panel</text>
<line class="e " x1="320" y1="68" x2="320" y2="98" marker-end="url(#ar-seguridad)"/>
<rect class="n " x="40" y="100" width="560" height="52" rx="6"/><text class="t" x="320" y="122">server.listen(127.0.0.1)</text><text class="s" x="320" y="139">no escucha en la red: solo esta máquina</text>
<line class="e " x1="320" y1="152" x2="320" y2="182" marker-end="url(#ar-seguridad)"/>
<rect class="n hl" x="40" y="184" width="560" height="64" rx="6"/><text class="t" x="320" y="204">allowed()</text><text class="s" x="320" y="221">Host debe ser 127.0.0.1:PORT o localhost:PORT (DNS rebinding)</text><text class="s" x="320" y="236">todo lo que no es GET lleva la cabecera X-MFS: 1 (CSRF)</text>
<rect class="n bad" x="660" y="194" width="280" height="44" rx="6"/><text class="t" x="800" y="220">403 Prohibido</text>
<line class="e " x1="600" y1="216" x2="658" y2="216" marker-end="url(#ar-seguridad)"/>
<text class="l" x="629" y="208" text-anchor="middle">no</text>
<line class="e " x1="320" y1="248" x2="320" y2="278" marker-end="url(#ar-seguridad)"/>
<rect class="n hl" x="40" y="280" width="560" height="84" rx="6"/>
<text class="t" x="320" y="302">validación de /api/action</text>
<text class="s" x="320" y="320">acción en ACTIONS · rama: BRANCH_RE + git check-ref-format</text>
<text class="s" x="320" y="336">install: INSTALL_CMD_RE, sin ; &amp; | &lt; &gt; ` $ ni saltos de línea</text>
<text class="s" x="320" y="352">run ≤ 500 caracteres sin saltos · commit obligatorio ≤ 2000</text>
<rect class="n bad" x="660" y="300" width="280" height="44" rx="6"/><text class="t" x="800" y="326">400 con el motivo</text>
<line class="e " x1="600" y1="322" x2="658" y2="322" marker-end="url(#ar-seguridad)"/>
<text class="l" x="629" y="314" text-anchor="middle">no</text>
<line class="e " x1="320" y1="364" x2="320" y2="394" marker-end="url(#ar-seguridad)"/>
<rect class="n hl" x="40" y="396" width="560" height="64" rx="6"/><text class="t" x="320" y="416">rutas confinadas</text><text class="s" x="320" y="433">resolveRepoDir: el repo está en la lista y dentro de WORK_DIR</text><text class="s" x="320" y="448">listas nuevas solo dentro de WORK_DIR (isInside)</text>
<line class="e " x1="320" y1="460" x2="320" y2="490" marker-end="url(#ar-seguridad)"/>
<rect class="n bad" x="40" y="492" width="560" height="52" rx="6"/><text class="t" x="320" y="514">bash manager_repo.sh</text><text class="s" x="320" y="531">eval del comando de la lista o de -r: se confía en listRep.txt</text>
<rect class="n dash" x="640" y="380" width="320" height="216" rx="6"/>
<text class="d" x="800" y="402">Token git</text>
<rect class="n " x="660" y="414" width="280" height="44" rx="6"/><text class="t" x="800" y="432">POST /api/token</text><text class="s" x="800" y="449">solo en memoria (gitToken)</text>
<line class="e " x1="800" y1="458" x2="800" y2="476" marker-end="url(#ar-seguridad)"/>
<rect class="n " x="660" y="478" width="280" height="44" rx="6"/><text class="t" x="800" y="496">MFS_GIT_TOKEN</text><text class="s" x="800" y="513">variable de entorno del bash</text>
<line class="e " x1="800" y1="522" x2="800" y2="540" marker-end="url(#ar-seguridad)"/>
<rect class="n " x="660" y="542" width="280" height="44" rx="6"/><text class="t" x="800" y="560">GIT_ASKPASS</text><text class="s" x="800" y="577">git-askpass.sh · credential.helper vacío</text>
<line class="e " x1="660" y1="500" x2="602" y2="516" marker-end="url(#ar-seguridad)"/>
<text class="l" x="618" y="500" text-anchor="end">env</text>
</g>
</svg>
