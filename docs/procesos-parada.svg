<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 624" width="980" height="624" role="img" aria-label="node server.js lanza bash manager_repo.sh, que abre un subshell con npm y el node del microfrontend; en Windows el panel busca el grupo de procesos con ps y mata cada árbol con taskkill; en Unix mata el grupo con SIGTERM.">
<title>Árbol de procesos y parada</title>
<style>
.bg{fill:#f5f7f7}
.ttl{font:700 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#14201f}
.n{fill:#ffffff;stroke:#9fb0ae;stroke-width:1.2}
.n.hl{fill:#e2f2ef;stroke:#0d7a6f;stroke-width:1.6}
.n.bad{fill:#fbecea;stroke:#b5503f;stroke-width:1.4}
.n.dash{stroke-dasharray:5 4}
.t{font:700 13px ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;fill:#14201f;text-anchor:middle}
.s{font:400 11.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#556563;text-anchor:middle}
.d{font:600 12.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#14201f;text-anchor:middle}
.l{font:500 11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#556563;paint-order:stroke;stroke:#f5f7f7;stroke-width:4px;stroke-linejoin:round}
.st{text-anchor:start}
.e{fill:none;stroke:#14201f;stroke-width:1.3}
.e.dash{stroke-dasharray:5 4}
.e.acc{stroke:#0d7a6f}
.e.life{stroke:#9fb0ae;stroke-dasharray:3 4}
.ah{fill:#14201f}
.dot{fill:#14201f}
@media (prefers-color-scheme:dark){
.bg{fill:#0f1716}
.ttl,.t,.d{fill:#e3ecea}
.s,.l{fill:#94a6a3}
.l{stroke:#0f1716}
.n{fill:#172221;stroke:#4b5f5c}
.n.hl{fill:#163631;stroke:#4fc2b2}
.n.bad{fill:#3a1f1b;stroke:#e0806f}
.e{stroke:#e3ecea}
.e.acc{stroke:#4fc2b2}
.e.life{stroke:#4b5f5c}
.ah,.dot{fill:#e3ecea}
}
</style>
<defs><marker id="ar-procesos-parada" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="980" height="624" rx="10"/>
<text class="ttl" x="40" y="30">Árbol de procesos y parada</text>
<g transform="translate(0,44)">
<text class="d st" x="40" y="36">Árbol de un job run</text>
<rect class="n hl" x="40" y="52" width="300" height="52" rx="6"/><text class="t" x="190" y="74">node ui/server.js</text><text class="s" x="190" y="91">panel · un job por repo</text>
<polyline class="e " points="60,104 60,168 78,168" marker-end="url(#ar-procesos-parada)"/>
<rect class="n " x="80" y="142" width="300" height="52" rx="6"/><text class="t" x="230" y="164">bash manager_repo.sh</text><text class="s" x="230" y="181">spawn · MFS_ONLY=repo · detached en Unix</text>
<polyline class="e " points="108,194 108,258 118,258" marker-end="url(#ar-procesos-parada)"/>
<rect class="n " x="120" y="232" width="300" height="52" rx="6"/><text class="t" x="270" y="254">( cd repo; eval cmd ) &amp;</text><text class="s" x="270" y="271">subshell en segundo plano (fork)</text>
<polyline class="e " points="140,284 140,348 158,348" marker-end="url(#ar-procesos-parada)"/>
<rect class="n " x="160" y="322" width="300" height="52" rx="6"/><text class="t" x="310" y="344">npm run start</text><text class="s" x="310" y="361">o el comando de la lista / -r</text>
<polyline class="e " points="180,374 180,438 198,438" marker-end="url(#ar-procesos-parada)"/>
<rect class="n " x="200" y="412" width="260" height="52" rx="6"/><text class="t" x="330" y="434">node del microfrontend</text><text class="s" x="330" y="451">escucha en el puerto</text>
<line class="e " x1="92" y1="194" x2="92" y2="500" marker-end="url(#ar-procesos-parada)"/>
<text class="l" x="84" y="480" text-anchor="end">run_repos</text>
<rect class="n dash" x="40" y="502" width="340" height="52" rx="6"/><text class="t" x="210" y="524">#NEW: start bash -c …</text><text class="s" x="210" y="541">ventana externa; su log no llega al panel</text>
<text class="d st" x="520" y="36">Parada en Windows (Git Bash)</text>
<rect class="n bad" x="520" y="52" width="410" height="52" rx="6"/><text class="t" x="725" y="74">taskkill /T sobre el bash no basta</text><text class="s" x="725" y="91">el fork de MSYS pierde el padre de Windows</text>
<line class="e " x1="725" y1="104" x2="725" y2="134" marker-end="url(#ar-procesos-parada)"/>
<text class="l" x="733" y="124" text-anchor="start">por eso</text>
<rect class="n " x="520" y="136" width="410" height="48" rx="6"/><text class="t" x="725" y="156">bash -c ps</text><text class="s" x="725" y="173">fila del bash raíz por su WINPID → su PGID</text>
<line class="e " x1="725" y1="184" x2="725" y2="204" marker-end="url(#ar-procesos-parada)"/>
<rect class="n " x="520" y="206" width="410" height="48" rx="6"/><text class="t" x="725" y="226">mismo PGID</text><text class="s" x="725" y="243">todos los WINPID de ese grupo de procesos</text>
<line class="e " x1="725" y1="254" x2="725" y2="274" marker-end="url(#ar-procesos-parada)"/>
<rect class="n hl" x="520" y="276" width="410" height="48" rx="6"/><text class="t" x="725" y="296">taskkill /T /F /PID … /PID …</text><text class="s" x="725" y="313">mata cada árbol nativo (killWindowsTree)</text>
<text class="d st" x="520" y="364">Parada en Linux / macOS</text>
<rect class="n " x="520" y="376" width="410" height="48" rx="6"/><text class="t" x="725" y="396">kill(-pid, SIGTERM)</text><text class="s" x="725" y="413">el bash tiene grupo propio (detached)</text>
<line class="e " x1="725" y1="424" x2="725" y2="460" marker-end="url(#ar-procesos-parada)"/>
<polyline class="e " points="930,300 955,300 955,488 932,488" marker-end="url(#ar-procesos-parada)"/>
<rect class="n " x="520" y="462" width="410" height="52" rx="6"/><text class="t" x="725" y="484">finishStop</text><text class="s" x="725" y="501">close + kill hecho + puerto libre → stopped</text>
</g>
</svg>
